services:
  postgres:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: wisdum
      POSTGRES_PASSWORD: wisdum
      POSTGRES_DB: wisdum
    ports:
      - '5432:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U wisdum']
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - '6379:6379'
    volumes:
      - redis_data:/data
    healthcheck:
      test: ['CMD', 'redis-cli', 'ping']
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    ports:
      - '3001:3001'
    environment:
      PORT: 3001
      WISDUM_ENV: development
      # Leave unset to get a random per-container secret (sessions end on restart).
      JWT_SECRET: ${JWT_SECRET:-}
      WISDUM_DEV_SEED: ${WISDUM_DEV_SEED:-false}
      WISDUM_ALLOW_SIGNUP: ${WISDUM_ALLOW_SIGNUP:-false}
      DATABASE_URL: postgresql://wisdum:wisdum@postgres:5432/wisdum
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGIN: http://localhost:3000
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_HOST: ${OLLAMA_HOST:-}
      REASONING_LLM_MODEL: ${REASONING_LLM_MODEL:-}
      PUBLIC_BASE_URL: ${PUBLIC_BASE_URL:-http://localhost:3000}
      DEVTO_API_KEY: ${DEVTO_API_KEY:-}
      GHOST_ADMIN_API_URL: ${GHOST_ADMIN_API_URL:-}
      GHOST_API_KEY: ${GHOST_API_KEY:-}
      SUBSTACK_WEBHOOK_URL: ${SUBSTACK_WEBHOOK_URL:-}
      EMBEDDING_ENABLED: ${EMBEDDING_ENABLED:-true}
      EMBEDDING_MODEL: ${EMBEDDING_MODEL:-}
      LOCAL_EMBEDDING_MODEL: ${LOCAL_EMBEDDING_MODEL:-}
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-false}
      REASONING_SCHEDULE_INTERVAL_MS: ${REASONING_SCHEDULE_INTERVAL_MS:-10800000}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      GITHUB_REPOSITORIES: ${GITHUB_REPOSITORIES:-}
      GITHUB_SYNC_TENANT_ID: ${GITHUB_SYNC_TENANT_ID:-}
      GITHUB_SYNC_INTERVAL_MS: ${GITHUB_SYNC_INTERVAL_MS:-86400000}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        NEXT_PUBLIC_API_URL: http://localhost:3001
    ports:
      - '3000:3000'
    depends_on:
      - api

volumes:
  postgres_data:
  redis_data:
